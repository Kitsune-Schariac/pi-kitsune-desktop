[package]
name = "pi-kitsune-desktop"
version = "0.3.2"
description = "Desktop GUI for pi coding agent"
edition = "2021"

[lib]
name = "pi_kitsune_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
# preserve_order: settings.json / models.json 写回时保持原键序 (默认 BTreeMap 会按字母重排 pi 的配置)
serde_json = { version = "1", features = ["preserve_order"] }
# 设置窗「测试连接 / 拉取模型」: 只要 rustls, 不拉 native-tls 第二套 TLS; 响应按文本读再交给 serde_json
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
base64 = "0.22"
tokio = { version = "1", features = ["full"] }
tauri-plugin-dialog = "2.7.2"
tauri-plugin-clipboard-manager = "2"
# 直接用 clipboard-manager 插件底层的 arboard 读 CF_HDROP 文件列表 (插件未暴露该能力), 不引入新 crate
arboard = { version = "3", default-features = false }
xcap = "0.9"
image = "0.25"
encoding_rs = "0.8"
